<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Tutorials</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');
        
        body {
            font-family: 'Inter', system_ui, sans-serif;
        }
        
        .logo-font {
            font-family: 'Space Grotesk', sans-serif;
        }
        
        .video-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .video-card:hover {
            transform: translateY(-4px);
        }
        
        .thumbnail-container {
            position: relative;
            overflow: hidden;
        }
        
        .duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background-color: rgba(0, 0, 0, 0.85);
            color: white;
            font-size: 13px;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 500;
        }
        
        .video-grid {
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        }
    </style>
</head>

<body class="bg-white text-zinc-900">
    <!-- Top Header -->
    <header class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-screen-2xl mx-auto px-4 md:px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-blue-600 rounded-2xl flex items-center justify-center text-white font-bold text-2xl logo-font">C</div>
                    <div class="logo-font text-2xl font-semibold tracking-tighter">Community</div>
                </div>
            </div>
            
            <!-- Spacer to maintain layout balance (category section removed) -->
            <div class="flex-1 max-w-[640px] mx-8"></div>
            
            <div class="flex items-center gap-7 text-sm font-medium">
                <!-- All category navigation links have been removed as requested -->
            </div>
        </div>
    </header>
    
    <div class="max-w-screen-2xl mx-auto px-4 md:px-6 py-6">
        <!-- Featured -->
        <div onclick="openYouTube(1)" class="cursor-pointer group mb-12">
            <div class="thumbnail-container rounded-2xl overflow-hidden bg-black aspect-video relative">
                <img id="featured-thumbnail" src="https://picsum.photos/id/1015/1600/900" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                <div class="duration text-base">42:18</div>
                
                <div class="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent opacity-0 group-hover:opacity-100 transition-all"></div>
                
                <div class="absolute bottom-0 left-0 p-8 text-white">
                    <h1 id="featured-title" class="text-3xl md:text-4xl font-semibold leading-tight">Building a Modern Dashboard with Tailwind CSS &amp; React</h1>
                    <p class="mt-3 text-white/80">Web Dev Community • 3 days ago</p>
                </div>
            </div>
        </div>
        
        <!-- Section Header -->
        <div class="flex justify-between items-center mb-6 px-1">
            <h2 id="section-title" class="text-2xl font-semibold">All Tutorials</h2>
        </div>
        
        <!-- Video Grid -->
        <div id="videoGrid" class="video-grid grid gap-x-4 gap-y-8">
            <!-- Populated by JS -->
        </div>
    </div>
    
    <script>
        const videos = [
        {
            id: 1,
            title: "Tailwind CSS Crash Course 2026",
            thumbnail: "https://picsum.photos/id/1015/600/340",
            duration: "1:12:45",
            channel: "Web Dev Community",
            uploaded: "2 days ago",
            category: "web",
            youtubeId: "dQw4w9wgxcq"
        },
        {
            id: 2,
            title: "Python Decorators Explained Simply",
            thumbnail: "https://picsum.photos/id/201/600/340",
            duration: "24:10",
            channel: "Python Learners",
            uploaded: "5 days ago",
            category: "python",
            youtubeId: "kqt9V7m4d4o"
        },
        {
            id: 3,
            title: "Building REST APIs with FastAPI",
            thumbnail: "https://picsum.photos/id/237/600/340",
            duration: "45:33",
            channel: "Backend Hub",
            uploaded: "1 week ago",
            category: "web",
            youtubeId: "0sOvCWFmrtA"
        },
        {
            id: 4,
            title: "Pandas for Data Analysis - Full Tutorial",
            thumbnail: "https://picsum.photos/id/251/600/340",
            duration: "58:20",
            channel: "Data Science Club",
            uploaded: "3 days ago",
            category: "data",
            youtubeId: "vmEHCJofslg"
        },
        {
            id: 5,
            title: "React Hooks Deep Dive",
            thumbnail: "https://picsum.photos/id/180/600/340",
            duration: "37:15",
            channel: "Frontend Collective",
            uploaded: "12 hours ago",
            category: "web",
            youtubeId: "TNhaISOUy6Q"
        },
        {
            id: 6,
            title: "Flutter Mobile App in 1 Hour",
            thumbnail: "https://picsum.photos/id/133/600/340",
            duration: "1:05:50",
            channel: "Mobile Devs",
            uploaded: "4 days ago",
            category: "mobile",
            youtubeId: "1ukSR1GRtMU"
        },
        {
            id: 7,
            title: "Next.js 15 - Complete Beginner Guide",
            thumbnail: "https://picsum.photos/id/201/600/340",
            duration: "2:05:12",
            channel: "Web Dev Community",
            uploaded: "1 day ago",
            category: "web",
            youtubeId: "S8B2p8f5y5M"
        }]
        
        // Category filtering and search have been completely removed.
        // Now all videos are always displayed without any filter or search functionality.
        
        function renderVideos(videoList) {
            const grid = document.getElementById('videoGrid')
            if (!grid) return
            grid.innerHTML = ''
            
            videoList.forEach(video => {
                const safeThumb = video.thumbnail || 'https://picsum.photos/id/1/600/340'
                const cardHTML = `
                    <div onclick="openYouTube(${video.id})" class="video-card cursor-pointer group">
                        <div class="thumbnail-container rounded-xl overflow-hidden bg-zinc-100">
                            <img src="${safeThumb}" class="w-full aspect-video object-cover group-hover:scale-105 transition-transform duration-300" alt="${video.title}">
                            <div class="duration">${video.duration}</div>
                        </div>
                        <div class="pt-4 px-1">
                            <h3 class="font-medium leading-tight line-clamp-2 text-base group-hover:text-blue-600 transition-colors">${escapeHtml(video.title)}</h3>
                            <div class="text-sm text-zinc-600 mt-3">${escapeHtml(video.channel)}</div>
                            <div class="text-sm text-zinc-500">${video.uploaded}</div>
                        </div>
                    </div>
                `
                grid.innerHTML += cardHTML
            })
        }
        
        // Simple helper to prevent XSS
        function escapeHtml(str) {
            if (!str) return ''
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;'
                if (m === '<') return '&lt;'
                if (m === '>') return '&gt;'
                return m
            }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
                return c
            })
        }
        
        function openYouTube(id) {
            const video = videos.find(v => v.id === id)
            if (video && video.youtubeId) {
                window.open(`https://www.youtube.com/watch?v=${video.youtubeId}`, '_blank')
            } else if (video) {
                // Fallback in case youtubeId is missing
                console.warn('No youtubeId for video', id)
            }
        }
        
        // Initialize: always show all videos, no filters, no search.
        window.onload = function() {
            // Ensure section title remains "All Tutorials" (no category or search text)
            const sectionTitleEl = document.getElementById('section-title')
            if (sectionTitleEl) {
                sectionTitleEl.textContent = 'All Tutorials'
            }
            // Render full list
            renderVideos(videos)
        }
    </script>
</body>

</html>
